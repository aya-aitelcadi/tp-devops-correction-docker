
# CI : tests du backend et analyse de la qualité du code
name: CI Backend

on:
  # Vérifier les modifications poussées sur main et develop
  push:
    branches:
      - main
      - develop

  # Vérifier les pull requests vers main et develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-backend:
    name: Tests backend et analyse SonarCloud
    runs-on: ubuntu-24.04

    steps:
      # Récupérer le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installer Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiler le backend et exécuter les tests
      - name: Build and test with Maven
        run: mvn -B clean verify --file simple-api/pom.xml

      # Analyser la qualité du code avec SonarCloud
      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=aya-aitelcadi_tp-devops-correction-docker
          -Dsonar.organization=aya-aitelcadi
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${SONAR_TOKEN}
          --file simple-api/pom.xml
