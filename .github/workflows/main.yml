
# CI/CD : tests du backend et publication des images Docker
name: CI devops 2025

on:
  # Lancer les tests sur les branches principales du TP
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  # Job 1 : compiler l'application et exÃ©cuter les tests
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      # RÃ©cupÃ©rer le code du dÃ©pÃ´t
      - name: Checkout code
        uses: actions/checkout@v4

      # Installer Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiler et tester le backend
      - name: Build and test with Maven
        run: mvn -B clean verify --file simple-api/pom.xml

      # Analyser la qualitÃ© du code avec SonarCloud
      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=aya-aitelcadi_tp-devops-correction-docker
          -Dsonar.organization=aya-aitelcadi
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${SONAR_TOKEN}
          --file simple-api/pom.xml


  # Job 2 : construire les images et les publier sur main
  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    # Ne publier que lors d'un push direct sur main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # RÃ©cupÃ©rer les fichiers et Dockerfiles
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Se connecter Ã  Docker Hub avec les secrets GitHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construire et publier l'image du backend
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      # Construire et publier l'image de la base de donnÃ©es
      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest

      # Construire et publier l'image du serveur HTTP
      - name: Build and push http-server
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-http-server:latest
